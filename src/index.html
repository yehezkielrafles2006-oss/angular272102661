<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angular272102661</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css" integrity="sha256-5UwXtC6TaPHCAbVQ59waEAqOssHyhn/twyuLRRWszzo=" crossorigin="anonymous" media="all" onload="this.media = 'all'">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous">

</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>
  <script>
    // Themes every Chart.js chart from AdminLTE's CSS variables and re-applies on <html data-bs-theme>/dir changes.
    (() => {
      'use strict';
      const { Chart } = globalThis;
      if (!Chart) return;

      const root = document.documentElement;
      const cssVar = (name, fallback = '') => getComputedStyle(root).getPropertyValue(name).trim() || fallback;

      // "#0d6efd" + 0.3 -> "rgba(13, 110, 253, 0.3)"; non-hex colours are returned as is.
      const alpha = (color, opacity) => {
        let hex = String(color).trim().replace(/^#/, '');
        if (!/^[\da-f]{3}([\da-f]{3})?$/i.test(hex)) return color;
        if (hex.length === 3) hex = [...hex].map((c) => c + c).join('');
        const [r, g, b] = [0, 2, 4].map((i) => Number.parseInt(hex.slice(i, i + 2), 16));
        return `rgba(${r}, ${g}, ${b}, ${opacity})`;
      };

      // Scriptable backgroundColor for area charts: line colour fading to transparent.
      const areaFill = (color, from = 0.35, to = 0) => (context) => {
        const { ctx, chartArea } = context.chart;
        if (!chartArea) return alpha(color, from);
        const gradient = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        gradient.addColorStop(0, alpha(color, from));
        gradient.addColorStop(1, alpha(color, to));
        return gradient;
      };

      let applied = [];

      const apply = () => {
        const text = cssVar('--bs-secondary-color', '#6c757d');
        const body = cssVar('--bs-body-color', '#212529');
        const surface = cssVar('--bs-body-bg', '#fff');
        const grid = `rgba(${cssVar('--bs-emphasis-color-rgb', '0, 0, 0')}, 0.08)`;
        const rtl = root.getAttribute('dir') === 'rtl';
        const d = Chart.defaults;
        applied = [text, grid];

        d.font.family = cssVar('--bs-body-font-family', d.font.family);
        d.font.size = 12;
        d.color = text;
        d.borderColor = grid;
        d.maintainAspectRatio = false;

        d.scale.grid.color = grid;
        d.scale.border.color = grid;
        d.scale.ticks.padding = 8;
        d.set('scales.linear', { border: { display: false } });
        d.set('scales.category', { grid: { display: false } });

        d.elements.line.borderWidth = 2;
        d.elements.point.radius = 0;
        d.elements.point.hoverRadius = 5;
        d.elements.point.hitRadius = 8;
        d.elements.point.hoverBorderWidth = 2;
        d.elements.point.borderColor = surface;
        d.elements.bar.borderRadius = 4;
        d.elements.arc.borderColor = surface;
        d.elements.arc.borderWidth = 2;

        const { legend, tooltip } = d.plugins;
        legend.position = 'bottom';
        legend.rtl = rtl;
        Object.assign(legend.labels, { color: body, usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 16 });
        Object.assign(tooltip, {
          rtl,
          backgroundColor: surface,
          borderColor: cssVar('--bs-border-color', '#dee2e6'),
          borderWidth: 1,
          titleColor: cssVar('--bs-emphasis-color', '#000'),
          bodyColor: body,
          titleFont: { weight: '600' },
          padding: 10,
          cornerRadius: 6,
          caretSize: 5,
          boxPadding: 4,
          usePointStyle: true,
        });

        for (const type of ['line', 'bar']) {
          Chart.overrides[type].interaction = { mode: 'index', intersect: false };
        }
      };

      // Chart.js copies scale colours into each chart at creation; drop copies still holding the old theme's colours.
      const forgetThemeColors = (options, stale) => {
        for (const [key, value] of Object.entries(options)) {
          if (value && typeof value === 'object' && !Array.isArray(value)) {
            forgetThemeColors(value, stale);
          } else if (/color$/i.test(key) && stale.includes(value)) {
            delete options[key];
          }
        }
      };

      const refresh = () => {
        const stale = applied;
        apply();
        for (const chart of Object.values(Chart.instances)) {
          forgetThemeColors(chart.config.options.scales || {}, stale);
          chart.update('none');
        }
      };

      apply();
      new MutationObserver(refresh).observe(root, { attributes: true, attributeFilter: ['data-bs-theme', 'dir'] });
      document.fonts?.addEventListener('loadingdone', refresh);

      globalThis.lteChartTheme = { cssVar, alpha, areaFill, refresh };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/jsvectormap.min.js" integrity="sha256-yjoBT8ZtgknE2gcA8yvWExzw8LsIAfj6/r/XAw889Qw=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.7.0/dist/maps/world.js" integrity="sha256-3jwsIc9jvdlaTPxHelZqSxiVedrrJhV+jssQEAAiTt0=" crossorigin="anonymous"></script>

</body>
</html>
